<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>6502life Bare Sim</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body { font-family: monospace; background: #111; color: #0f0; padding: 12px;
               overscroll-behavior: none; }
        h3 { margin-bottom: 4px; }
        #mode { font-size: 12px; color: #0a0; }
        #stats { font-size: 13px; margin: 4px 0 8px; overflow: hidden;
                 white-space: nowrap; text-overflow: ellipsis; }
        #cellinfo { font-size: 11px; color: #080; margin: 2px 0; }

        .main {
            display: grid;
            grid-template-columns: 3fr 1fr;
            grid-template-rows: 1fr auto;
            gap: 8px;
            width: 100%;
            max-width: 900px;
        }
        .grid-col { grid-row: 1; grid-column: 1; }
        #grid {
            width: 100%;
            aspect-ratio: 2 / 3;
            cursor: crosshair;
            image-rendering: pixelated;
            display: block;
            touch-action: none;
        }
        .maps {
            grid-row: 1; grid-column: 2;
            display: flex; flex-direction: column;
            gap: 4px;
        }
        .maps canvas {
            width: 100%;
            image-rendering: pixelated;
            display: block;
        }
        #cv0 { border: 1px solid #006; }
        #cv1 { border: 1px solid #600; }

        .bottom {
            grid-row: 2; grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 6px;
            align-items: start;
        }
        #disasm {
            font-size: 10px; line-height: 1.3; color: #0a0;
            white-space: pre; margin: 0;
            min-height: 8em;
        }
        .dasm-cur { color: #fff; background: #030; }

        .ctrl-col {
            display: flex; flex-direction: column;
            gap: 4px;
            min-width: 80px;
        }
        button, select {
            font-family: monospace; font-size: 13px; padding: 5px 8px;
            background: #030; color: #0f0; border: 1px solid #0f0;
            cursor: pointer; width: 100%;
        }
        #specimens { display: flex; flex-direction: column; gap: 2px; }
        .specimen {
            font-family: monospace; font-size: 10px; padding: 2px 4px;
            background: #020; color: #0a0; border: 1px solid #040;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; gap: 4px;
        }
        .specimen:hover { background: #030; border-color: #0f0; }
        .specimen.active { background: #041; border-color: #0f0; color: #0f0; }
        .specimen .spec-x { color: #600; cursor: pointer; padding: 0 2px; }
        .specimen .spec-x:hover { color: #f00; }

        #log { white-space: pre; font-size: 11px; line-height: 1.2;
               max-height: 60px; overflow-y: auto; margin-top: 8px; }
    </style>
</head>
<body>
    <h3>6502life Bare Sim</h3>
    <div id="mode"></div>
    <div id="stats"></div>

    <div class="main">
        <div class="grid-col">
            <canvas id="grid"></canvas>
        </div>
        <div class="maps">
            <canvas id="cv0" width="64" height="64"></canvas>
            <div id="cellinfo"></div>
            <canvas id="cv1" width="64" height="64"></canvas>
            <div id="specimens"></div>
        </div>
        <div class="bottom">
            <pre id="disasm"></pre>
            <div class="ctrl-col">
                <button id="toggle">Start</button>
                <select id="speed">
                    <option value="50">50K</option>
                    <option value="100">100K</option>
                    <option value="200">200K</option>
                    <option value="300" selected>300K</option>
                    <option value="400">400K</option>
                    <option value="500">500K</option>
                </select>
                <select id="engine">
                    <option value="gpu">GPU</option>
                    <option value="cpu">CPU</option>
                </select>
            </div>
            <div class="ctrl-col">
                <button id="soup">Soup</button>
                <button id="rep">Rep</button>
                <button id="capture">Capture</button>
            </div>
            <div class="ctrl-col">
                <select id="noise">
                    <option value="0" selected>noise:0</option>
                    <option value="1e-9">1/1G</option>
                    <option value="1e-8">1/100M</option>
                    <option value="1e-7">1/10M</option>
                    <option value="1e-6">1/1M</option>
                    <option value="1e-5">1/100K</option>
                    <option value="0.0001">1/10K</option>
                </select>
                <select id="brush"></select>
            </div>
        </div>
    </div>

    <pre id="log"></pre>
    <script type="module">
        import { disassemble } from './disasm.js';

        const $ = id => document.getElementById(id);
        const logEl=$('log'), gridCanvas=$('grid'), statsEl=$('stats');
        const modeEl=$('mode'), cellInfoEl=$('cellinfo'), dasmEl=$('disasm');
        const gridCtx = gridCanvas.getContext('2d');
        const ctx0 = $('cv0').getContext('2d'), ctx1 = $('cv1').getContext('2d');
        function print(msg) { logEl.textContent += msg + '\n'; }

        let running=false, gpuMode=false, gpuAvailable=false, gpuSim=null, worker=null;
        const B=32, MEAN_CYC=4096, CHAR_W=8, CHAR_H=12;

        // Target speed in cycles/cell/sec from dropdown (value is in K)
        function targetCycPerSec() { return (parseFloat($('speed').value) || 300) * 1000; }
        // Passes per tick at ~60fps. Each pass = 1 quantum per cell = MEAN_CYC cycles.
        function passesPerTick() { return targetCycPerSec() / (MEAN_CYC * 60); }
        let inspectI=Math.floor(B/2), inspectJ=Math.floor(B/2);
        let inspectNI=inspectI, inspectNJ=inspectJ-1; // S neighbor by default
        let lastCensus=null, lastCellView0=null, lastCellView1=null;
        let totalQuanta=0, rateEMA=0, lastQuanta=0, lastRateTime=0;
        let fpsFrames=0, fpsT0=0, fpsVal=0;
        let currentTrace=null, traceIdx=0;
        let glowWrite=new Float32Array(2048), glowFetch=new Float32Array(2048);
        const GLOW_DECAY=0.93;
        let nbrDir='s';

        // --- Replicator program (LDA zp,X; STA abs,X; INX; BCC) ---
        const REP_CODE = [0xB5, 0x00, 0x9D, 0x00, 0x04, 0xE8, 0x90, 0xF8];

        // --- Brush ---
        function initBrush() {
            const sel = $('brush');
            const maxB = Math.floor(B / 4);
            for (let b = 1; b <= maxB; b++) {
                const opt = document.createElement('option');
                opt.value = b;
                const side = 2 * b - 1;
                opt.textContent = b === 1 ? 'brush:1' : `brush:${side}\u00D7${side}`;
                sel.appendChild(opt);
            }
        }
        function getBrushSize() { return parseInt($('brush').value) || 1; }

        // --- Specimens ---
        const MAX_SPECIMENS = 8;
        const specimens = []; // { data: Uint8Array(1024), char, time, copies }
        let activeSpecimen = -1; // index of highlighted specimen for auto-placement

        function captureSpecimen() {
            if (!lastCellView0 || !lastCensus) return;
            if (specimens.length >= MAX_SPECIMENS) {
                print('Specimen list full (max ' + MAX_SPECIMENS + ').');
                return;
            }
            const data = new Uint8Array(lastCellView0.data.slice(0, 1024));
            // Compute hash for copy count
            let h = 5381;
            for (let k = 0; k < 0xF0; k++) h = ((h * 33) ^ data[k]) >>> 0;
            for (let k = 0x200; k < 0x400; k++) h = ((h * 33) ^ data[k]) >>> 0;
            const ch = String.fromCharCode(33 + (h % 94));
            // Count copies: cells with same char in census
            const c = lastCensus;
            let copies = 0;
            for (let k = 0; k < c.cellChars.length; k++)
                if (c.cellChars[k] === ch.charCodeAt(0)) copies++;
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            specimens.push({ data, char: ch, time, copies });
            renderSpecimens();
        }

        async function injectSpecimen(idx) {
            const spec = specimens[idx];
            if (!spec) return;
            const brush = getBrushSize();
            const r = brush - 1; // radius: brush=1 -> r=0 (single cell)
            for (let di = -r; di <= r; di++) {
                for (let dj = -r; dj <= r; dj++) {
                    const ci = ((inspectI + di) % B + B) % B;
                    const cj = ((inspectJ + dj) % B + B) % B;
                    if (gpuMode && gpuSim) {
                        gpuSim.writeCell(ci, cj, 0, spec.data);
                    } else if (worker) {
                        workerSend({type:'writeCell', i: ci, j: cj, offset: 0,
                                    data: Array.from(spec.data)});
                    }
                }
            }
            // Refresh census so grid updates
            if (gpuMode && gpuSim) {
                lastCensus = await gpuSim.census();
                totalQuanta = gpuSim.totalQuanta;
            } else if (worker) {
                workerSend({type:'census'});
            }
            requestCellViews();
        }

        function clearActiveSpecimen() {
            activeSpecimen = -1;
            renderSpecimens();
        }

        function removeSpecimen(idx) {
            specimens.splice(idx, 1);
            activeSpecimen = -1;
            renderSpecimens();
        }

        function renderSpecimens() {
            const el = $('specimens');
            el.innerHTML = '';
            specimens.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = 'specimen' + (i === activeSpecimen ? ' active' : '');
                const label = document.createElement('span');
                label.textContent = s.char + ' ' + s.time + ' x' + s.copies;
                // Single click: inject once; if a different specimen is active, switch to it
                label.onclick = () => {
                    if (activeSpecimen >= 0 && activeSpecimen !== i) {
                        clearActiveSpecimen();
                    }
                    injectSpecimen(i);
                };
                // Double click: toggle auto-placement mode
                label.ondblclick = (e) => {
                    e.preventDefault();
                    if (activeSpecimen === i) {
                        clearActiveSpecimen();
                    } else {
                        activeSpecimen = i;
                        renderSpecimens();
                    }
                };
                const x = document.createElement('span');
                x.className = 'spec-x';
                x.textContent = 'X';
                x.onclick = (e) => { e.stopPropagation(); removeSpecimen(i); };
                div.appendChild(label);
                div.appendChild(x);
                el.appendChild(div);
            });
        }

        // --- Cosmic ray noise: random bit flips per pass ---
        function getNoiseRate() { return parseFloat($('noise').value) || 0; }
        const TOTAL_BITS = B * B * 1024 * 8;
        const TOTAL_BYTES = B * B * 1024;

        function sampleFlipCount(rng, p) {
            if (p <= 0) return 0;
            const lambda = p * TOTAL_BITS;
            if (lambda < 30) {
                let L = Math.exp(-lambda), k = 0, pr = 1;
                do { k++; pr *= rng.real(); } while (pr > L);
                return k - 1;
            }
            const u1 = rng.real() || 1e-10, u2 = rng.real();
            const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
            return Math.max(0, Math.round(lambda + Math.sqrt(lambda) * z));
        }

        // GPU mode: read from census snapshot, flip, write back via writeCell
        function applyCosmicRaysGpu(sim) {
            const p = getNoiseRate();
            if (p <= 0 || !sim._storageSnapshot || !sim.rng) return;
            const rng = sim.rng;
            const nFlips = sampleFlipCount(rng, p);
            const snap = sim._storageSnapshot;
            const M = sim.M;
            for (let i = 0; i < nFlips; i++) {
                const byteIdx = rng.below(TOTAL_BYTES);
                const bitIdx = rng.below(8);
                snap[byteIdx] ^= (1 << bitIdx);
                // Write the modified byte back to GPU
                const cellIdx = (byteIdx / M) | 0;
                const ci = (cellIdx / B) | 0, cj = cellIdx % B;
                const offset = byteIdx % M;
                sim.writeCell(ci, cj, offset, [snap[byteIdx]]);
            }
        }

        function updateNeighbor() {
            inspectNI=(inspectI+(nbrDir==='e'?1:nbrDir==='w'?-1:0)+B)%B;
            inspectNJ=(inspectJ+(nbrDir==='s'?-1:nbrDir==='n'?1:0)+B)%B;
            cellInfoEl.textContent='('+inspectI+','+inspectJ+') '+nbrDir.toUpperCase()+' ('+inspectNI+','+inspectNJ+')';
            if(worker) worker.postMessage({type:'traceCell',i:inspectI,j:inspectJ});
        }

        function initGridCanvas() {
            gridCanvas.width=B*CHAR_W; gridCanvas.height=B*CHAR_H;
            gridCtx.font='10px monospace'; gridCtx.textBaseline='top';
        }

        function formatRate(cps) {
            if(cps>=1e6) return (cps/1e6).toFixed(1)+'M';
            if(cps>=1e3) return Math.round(cps/1e3)+'K';
            return cps.toFixed(0);
        }

        function renderGrid() {
            if(!lastCensus) return;
            const c=lastCensus, now=performance.now();
            if(running && now-lastRateTime>300) {
                const dq=totalQuanta-lastQuanta, dt=(now-lastRateTime)/1000;
                rateEMA=rateEMA*0.7+(dt>0?dq*MEAN_CYC/(B*B)/dt:0)*0.3;
                lastQuanta=totalQuanta; lastRateTime=now;
            }
            const cps=running?rateEMA:0;
            fpsFrames++;
            if(now-fpsT0>1000){fpsVal=Math.round(fpsFrames*1000/(now-fpsT0));fpsFrames=0;fpsT0=now;}
            // Show rate with target comparison when underperforming
            const target = targetCycPerSec();
            const ratio = target > 0 ? cps / target : 1;
            let rateStr = formatRate(cps);
            if (running && ratio < 0.85) {
                rateStr += ' <' + formatRate(target);
                statsEl.style.color = '#ccc';
            } else {
                statsEl.style.color = '';
            }
            statsEl.textContent=c.functional+'/'+c.total+' alive '+rateStr+' cyc/cell/s '+fpsVal+'fps';

            gridCtx.fillStyle='#111'; gridCtx.fillRect(0,0,gridCanvas.width,gridCanvas.height);
            gridCtx.font='10px monospace'; gridCtx.textBaseline='top';
            for(let j=B-1;j>=0;j--) for(let i=0;i<B;i++) {
                const sx=i*CHAR_W, sy=(B-1-j)*CHAR_H;
                const ch=String.fromCharCode(c.cellChars[i*B+j]);
                if(i===inspectI&&j===inspectJ) {
                    gridCtx.fillStyle='#00c'; gridCtx.fillRect(sx,sy,CHAR_W,CHAR_H); gridCtx.fillStyle='#fff';
                } else if(i===inspectNI&&j===inspectNJ) {
                    gridCtx.fillStyle='#a00'; gridCtx.fillRect(sx,sy,CHAR_W,CHAR_H); gridCtx.fillStyle='#fff';
                } else { gridCtx.fillStyle='#0f0'; }
                gridCtx.fillText(ch,sx,sy);
            }
        }

        const CELL_VIEW_ROWS = 16;  // first 2 pages (512 bytes); set to 32 for all 4
        const CELL_VIEW_BITS = CELL_VIEW_ROWS * 32 * 8;  // 4096 bits per cell view
        // EMA buffers for bitmap smoothing (one per cell view)
        const bitmapEma = [new Float32Array(CELL_VIEW_BITS), new Float32Array(CELL_VIEW_BITS)];
        // Half-life in seconds; alpha = 1 - 2^(-dt/halfLife)
        const BITMAP_EMA_HALFLIFE = 0.4;  // ~400ms ≈ 24 frames at 60fps

        function renderCellView(ctx, cellData, glowOff, emaIdx) {
            if(!cellData) return;
            const W=64, H=CELL_VIEW_ROWS*4;
            const ema = bitmapEma[emaIdx];
            // Alpha for ~16.7ms frame at 60fps
            const alpha = 1 - Math.pow(0.5, (1/60) / BITMAP_EMA_HALFLIFE);
            const img=ctx.createImageData(W,H); const d=img.data;
            let bitIdx = 0;
            for(let row=0;row<CELL_VIEW_ROWS;row++) for(let col=0;col<32;col++) {
                const byteIdx=row*32+col, val=cellData[byteIdx];
                const wI=Math.pow(Math.min(1,glowWrite[glowOff+byteIdx]),0.3);
                const fI=Math.pow(Math.min(1,glowFetch[glowOff+byteIdx]),0.3);
                for(let dy=0;dy<4;dy++) for(let dx=0;dx<2;dx++) {
                    const bit=(val>>(7-(dy*2+dx)))&1;
                    ema[bitIdx] += alpha * (bit - ema[bitIdx]);
                    const v = ema[bitIdx];
                    const pi=((row*4+dy)*W+col*2+dx)*4;
                    // Brightness from EMA value (0..1), tinted by write/fetch glow
                    d[pi]  =Math.min(255,Math.floor(v*(wI*255+20)));
                    d[pi+1]=Math.min(255,Math.floor(v*255));
                    d[pi+2]=Math.min(255,Math.floor(v*(fI*255+20)));
                    d[pi+3]=255;
                    bitIdx++;
                }
            }
            ctx.putImageData(img,0,0);
        }

        function renderDisasm() {
            if(!lastCellView0) { dasmEl.textContent=''; return; }
            const mem=lastCellView0.data;
            const pc=(mem[0xF9]<<8)|mem[0xFA];
            const lines=disassemble(mem,pc,8,0x3FF); // 1K cell mask
            let html='';
            for(let i=0;i<lines.length;i++) {
                if(i===0) html+='<span class="dasm-cur">'+escHtml(lines[i].text)+'</span>\n';
                else html+=escHtml(lines[i].text)+'\n';
            }
            dasmEl.innerHTML=html;
        }
        function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

        function animateTrace() {
            if(!currentTrace||traceIdx>=currentTrace.length) return;
            const ppt = passesPerTick();
            const cycPerFrame = ppt < 0.5 ? 4 : ppt < 2 ? 20 : 99999;
            let cyc=0;
            while(traceIdx<currentTrace.length&&cyc<cycPerFrame) {
                const insn=currentTrace[traceIdx];
                glowFetch[insn.fetch]=1.0;
                for(const wa of insn.writes) glowWrite[wa]=1.0;
                cyc+=insn.cycles; traceIdx++;
            }
        }

        // --- Render loop: always 60fps. GPU sim runs inline with time budget. ---
        let gpuPassDebt = 0;
        async function renderLoop() {
            // GPU sim: run passes for this frame (fractional accumulator)
            if (running && gpuMode && gpuSim) {
                gpuPassDebt += passesPerTick();
                const t0 = performance.now();
                let didPass = false;
                while (gpuPassDebt >= 1 && performance.now() - t0 < 10) {
                    await gpuSim.runPass();
                    await gpuSim.runPass();
                    gpuPassDebt--;
                    didPass = true;
                }
                if (gpuPassDebt > 3) gpuPassDebt = 3;
                lastCensus = await gpuSim.census();
                totalQuanta = gpuSim.totalQuanta;
                // Cosmic rays: flip bits in snapshot, write back to GPU
                if (didPass) applyCosmicRaysGpu(gpuSim);
            }

            // Fetch latest cell views
            if (running) requestCellViews();

            // Render everything
            for(let i=0;i<2048;i++){glowWrite[i]*=GLOW_DECAY;glowFetch[i]*=GLOW_DECAY;}
            animateTrace();
            renderGrid();
            if(lastCellView0) renderCellView(ctx0,lastCellView0.data,0,0);
            if(lastCellView1) renderCellView(ctx1,lastCellView1.data,1024,1);
            renderDisasm();
            requestAnimationFrame(renderLoop);
        }

        // --- SHA-256 soup: fill board with provably random bytes ---
        async function sha256soup(totalBytes) {
            const out = new Uint8Array(totalBytes);
            const seed = crypto.getRandomValues(new Uint8Array(32));
            let filled = 0, counter = 0;
            while (filled < totalBytes) {
                const input = new Uint8Array(36);
                input.set(seed);
                input[32] = (counter >> 24) & 0xFF;
                input[33] = (counter >> 16) & 0xFF;
                input[34] = (counter >> 8) & 0xFF;
                input[35] = counter & 0xFF;
                const hash = new Uint8Array(await crypto.subtle.digest('SHA-256', input));
                const n = Math.min(32, totalBytes - filled);
                out.set(hash.subarray(0, n), filled);
                filled += n;
                counter++;
            }
            return out;
        }

        async function initSoup() {
            const wasRunning = running;
            if (running) { running = false; if (!gpuMode && worker) workerSend({type:'stop'}); }
            totalQuanta = 0; rateEMA = 0;
            const totalBytes = B * B * 1024;
            const data = await sha256soup(totalBytes);
            if (gpuMode && gpuSim) {
                gpuSim.totalQuanta = 0;
                // Write in cell-sized chunks (aligned to 4 bytes)
                for (let i = 0; i < B; i++)
                    for (let j = 0; j < B; j++) {
                        const off = (i * B + j) * 1024;
                        gpuSim.writeCell(i, j, 0, data.subarray(off, off + 1024));
                    }
                lastCensus = await gpuSim.census();
            } else if (worker) {
                workerSend({type:'init', B});
                // Wait for ready, then fill
                await new Promise(resolve => {
                    const orig = worker.onmessage;
                    worker.onmessage = (e) => {
                        orig(e);
                        if (e.data.type === 'ready') resolve();
                    };
                });
                for (let i = 0; i < B; i++)
                    for (let j = 0; j < B; j++) {
                        const off = (i * B + j) * 1024;
                        workerSend({type:'writeCell', i, j, offset: 0, data: Array.from(data.subarray(off, off + 1024))});
                    }
                workerSend({type:'census'});
            }
            glowWrite.fill(0); glowFetch.fill(0);
            currentTrace = null;
            updateNeighbor(); requestCellViews();
            print('Soup: SHA-256 random board initialized.');
            if (wasRunning) { running = true; startSim(); }
        }

        function initRep() {
            const wasRunning = running;
            if (running) { running = false; if (!gpuMode && worker) workerSend({type:'stop'}); }
            totalQuanta = 0; rateEMA = 0;
            if (gpuMode && gpuSim) {
                gpuSim.totalQuanta = 0;
                // Zero all cells, then write replicator at (0,0)
                for (let i = 0; i < B; i++)
                    for (let j = 0; j < B; j++)
                        gpuSim.writeCell(i, j, 0, new Uint8Array(1024));
                gpuSim.writeCell(0, 0, 0, REP_CODE);
                gpuSim.writeCell(0, 0, 0xF9, [0x00, 0x00]);
                gpuSim.writeCell(0, 0, 0xFF, [0xFF]);
                gpuSim.census().then(c => { lastCensus = c; });
            } else if (worker) {
                workerSend({type:'init', B});
                // Worker init creates a fresh zero board; inject replicator on ready
            }
            glowWrite.fill(0); glowFetch.fill(0);
            currentTrace = null;
            updateNeighbor(); requestCellViews();
            print('Rep: single replicator at (0,0).');
            if (wasRunning) { running = true; /* startSim called after worker ready */ }
        }

        function startSim() {
            lastRateTime = performance.now(); lastQuanta = totalQuanta; rateEMA = 0;
            fpsT0 = performance.now(); fpsFrames = 0;
            gpuPassDebt = 0;
            if (!gpuMode) {
                workerSend({type:'noise', rate: getNoiseRate()});
                workerSend({type:'start', speed: passesPerTick()});
            }
        }

        // (GPU sim runs inline in renderLoop — no separate loop needed)

        // === Worker ===
        function workerSend(msg){worker.postMessage(msg);}
        function requestCellViews() {
            if(gpuMode&&gpuSim&&gpuSim.getCellView) {
                lastCellView0=gpuSim.getCellView(inspectI,inspectJ);
                lastCellView1=gpuSim.getCellView(inspectNI,inspectNJ);
            } else if(worker) {
                workerSend({type:'getCellView',i:inspectI,j:inspectJ});
                workerSend({type:'getCellView',i:inspectNI,j:inspectNJ});
            }
        }
        function setupWorker() {
            worker=new Worker('./sim-worker.js',{type:'module'});
            worker.onmessage=(e)=>{
                const msg=e.data;
                if(msg.type==='ready'){
                    if (!gpuMode) {
                        workerSend({type:'writeCell',i:0,j:0,offset:0,data:[...REP_CODE]});
                        workerSend({type:'writeCell',i:0,j:0,offset:0xF9,data:[0x00,0x00]});
                        workerSend({type:'writeCell',i:0,j:0,offset:0xFF,data:[0xFF]});
                        workerSend({type:'traceCell',i:inspectI,j:inspectJ});
                        workerSend({type:'census'});
                        if(running) startSim();
                    }
                } else if(msg.type==='census'){
                    lastCensus=msg.data; totalQuanta=msg.totalQuanta;
                } else if(msg.type==='cellView'){
                    if(msg.i===inspectI&&msg.j===inspectJ) lastCellView0=msg;
                    else if(msg.i===inspectNI&&msg.j===inspectNJ) lastCellView1=msg;
                } else if(msg.type==='trace'){
                    currentTrace=msg.data.trace; traceIdx=0;
                }
            };
        }

        // --- Grid interaction: tap to select cell, drag to set neighbor direction ---
        function selectCellAt(clientX, clientY) {
            const rect=gridCanvas.getBoundingClientRect();
            const col=Math.floor((clientX-rect.left)*gridCanvas.width/rect.width/CHAR_W);
            const row=B-1-Math.floor((clientY-rect.top)*gridCanvas.height/rect.height/CHAR_H);
            if(col>=0&&col<B&&row>=0&&row<B){
                inspectI=col;inspectJ=row;
                updateNeighbor(); glowWrite.fill(0);glowFetch.fill(0);
                bitmapEma[0].fill(0); bitmapEma[1].fill(0);
                requestCellViews();
                // Auto-place active specimen at new cell
                if (activeSpecimen >= 0 && specimens[activeSpecimen]) {
                    injectSpecimen(activeSpecimen);
                }
            }
        }
        {
            let dragStart = null;
            function onDragStart(x, y) { dragStart = { x, y }; }
            function onDragEnd(x, y) {
                if (!dragStart) return;
                const dx = x - dragStart.x, dy = y - dragStart.y;
                const sx = dragStart.x, sy = dragStart.y;
                dragStart = null;
                if (dx*dx + dy*dy < 64) { selectCellAt(sx, sy); return; }
                if (Math.abs(dx) > Math.abs(dy)) {
                    nbrDir = dx > 0 ? 'e' : 'w';
                } else {
                    nbrDir = dy > 0 ? 's' : 'n';
                }
                updateNeighbor(); requestCellViews();
            }
            gridCanvas.addEventListener('mousedown', e => onDragStart(e.clientX, e.clientY));
            gridCanvas.addEventListener('mouseup', e => onDragEnd(e.clientX, e.clientY));
            gridCanvas.addEventListener('touchstart', e => {
                e.preventDefault();
                onDragStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
            gridCanvas.addEventListener('touchend', e => {
                e.preventDefault();
                onDragEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }, { passive: false });
            gridCanvas.onclick = null; // handled by mousedown/mouseup
        }

        $('speed').onchange=()=>{if(!gpuMode&&running)workerSend({type:'speed',speed:passesPerTick()});};
        $('noise').onchange=()=>{if(worker)workerSend({type:'noise',rate:getNoiseRate()});};
        $('capture').onclick = () => captureSpecimen();

        function switchToGpu() {
            gpuMode = true;
            modeEl.textContent = '[GPU]';
            $('engine').value = 'gpu';
            // Init with replicator
            gpuSim.writeCell(0,0,0,REP_CODE);
            gpuSim.writeCell(0,0,0xF9,[0x00,0x00]);
            gpuSim.writeCell(0,0,0xFF,[0xFF]);
        }

        function switchToCpu() {
            gpuMode = false;
            modeEl.textContent = '[CPU]';
            $('engine').value = 'cpu';
            if (!worker) { setupWorker(); }
            workerSend({type:'init', B});
            workerSend({type:'noise', rate: getNoiseRate()});
        }

        $('engine').onchange = () => {
            const wasRunning = running;
            if (running) { running = false; if (!gpuMode && worker) workerSend({type:'stop'}); }
            totalQuanta = 0; rateEMA = 0;
            if ($('engine').value === 'gpu' && gpuAvailable) {
                switchToGpu();
            } else {
                switchToCpu();
            }
            glowWrite.fill(0); glowFetch.fill(0);
            updateNeighbor(); requestCellViews();
            if (wasRunning) { running = true; startSim(); }
        };

        async function main() {
            logEl.textContent='';
            // Try GPU init
            if(navigator.gpu){try{
                const adapter=await navigator.gpu.requestAdapter();
                if(adapter){const{BareSim}=await import('./bare-sim.js');gpuSim=await BareSim.create(B);gpuAvailable=true;}
            }catch(e){print('GPU: '+e.message);}}
            // Always set up worker (needed for CPU mode)
            setupWorker();
            if(gpuAvailable){
                switchToGpu();
                lastCensus=await gpuSim.census();totalQuanta=gpuSim.totalQuanta;
                if(gpuSim.getCellView){lastCellView0=gpuSim.getCellView(inspectI,inspectJ);lastCellView1=gpuSim.getCellView(inspectNI,inspectNJ);}
            } else {
                // Disable GPU option if not available
                $('engine').querySelector('[value=gpu]').disabled = true;
                $('engine').value = 'cpu';
                modeEl.textContent='[CPU]';
                workerSend({type:'init',B});
            }
            print(B+'x'+B+' board. Click to inspect, drag to set neighbor direction.');
            initGridCanvas(); initBrush(); fpsT0=lastRateTime=performance.now();
            updateNeighbor();
            requestAnimationFrame(renderLoop);
        }

        $('toggle').onclick=()=>{
            running=!running;
            $('toggle').textContent=running?'Stop':'Start';
            if(running){
                startSim();
            } else {
                if(!gpuMode){workerSend({type:'stop'});workerSend({type:'census'});}
                requestCellViews();
            }
        };

        $('soup').onclick = () => initSoup();
        $('rep').onclick = () => initRep();

        main();
    </script>
</body>
</html>
