<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>6502life Bare Sim</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
        #log { white-space: pre; font-size: 11px; line-height: 1.2; max-height: 100px; overflow-y: auto; }
        #grid { cursor: crosshair; }
        #stats { font-size: 14px; margin: 8px 0; }
        #mode { font-size: 12px; color: #0a0; margin-bottom: 8px; }
        #cellinfo { font-size: 11px; color: #080; }
        button, select { font-family: monospace; font-size: 14px; padding: 6px 12px;
                 background: #030; color: #0f0; border: 1px solid #0f0; cursor: pointer;
                 margin-right: 6px; margin-bottom: 6px; }
        select { padding: 4px 8px; }
    </style>
</head>
<body>
    <h3>6502life Bare Sim</h3>
    <div id="mode"></div>
    <div id="stats"></div>
    <div style="display:flex; gap:12px; align-items:flex-start; margin:8px 0;">
        <canvas id="grid"></canvas>
        <div>
            <canvas id="cv0" width="128" height="64" style="border:1px solid #066; image-rendering:pixelated; width:256px; height:128px; display:block;"></canvas>
            <canvas id="cv1" width="128" height="64" style="border:1px solid #036; image-rendering:pixelated; width:256px; height:128px; display:block; margin-top:4px;"></canvas>
            <div id="cellinfo"></div>
        </div>
    </div>
    <div style="margin-top:8px;">
        <button id="toggle">Start</button>
        <select id="speed">
            <option value="0.05">crawl</option>
            <option value="0.1">very slow</option>
            <option value="0.25">slow</option>
            <option value="1" selected>normal</option>
            <option value="5">fast</option>
            <option value="25">very fast</option>
            <option value="100">max</option>
        </select>
    </div>
    <pre id="log"></pre>
    <script type="module">
        const logEl = document.getElementById('log');
        const gridCanvas = document.getElementById('grid');
        const gridCtx = gridCanvas.getContext('2d');
        const statsEl = document.getElementById('stats');
        const modeEl = document.getElementById('mode');
        const cellInfoEl = document.getElementById('cellinfo');
        const cvs0 = document.getElementById('cv0');
        const ctx0 = cvs0.getContext('2d');
        const cvs1 = document.getElementById('cv1');
        const ctx1 = cvs1.getContext('2d');

        function print(msg) { logEl.textContent += msg + '\n'; }

        let sim = null;
        let t0 = 0;
        let running = false;
        let gpuMode = false;
        let inspectI = 0, inspectJ = 0;
        let inspectNI = 1, inspectNJ = 0;
        // Mean cycles per quantum (~4096)
        const MEAN_CYCLES_PER_QUANTUM = 4096;

        const CHAR_W = 8, CHAR_H = 12;

        function initGridCanvas() {
            const B = sim.B;
            gridCanvas.width = B * CHAR_W;
            gridCanvas.height = B * CHAR_H;
            gridCanvas.style.width = (B * CHAR_W) + 'px';
            gridCanvas.style.height = (B * CHAR_H) + 'px';
            gridCtx.font = '10px monospace';
            gridCtx.textBaseline = 'top';
        }

        async function drawGrid() {
            const c = await sim.census();
            const B = sim.B;
            const elapsed = (performance.now() - t0) / 1000;
            // Each quantum gives one cell ~4096 cycles on average
            const totalCellCycles = sim.totalQuanta * MEAN_CYCLES_PER_QUANTUM;
            const cycPerCellPerSec = elapsed > 0 ? (totalCellCycles / (B * B) / elapsed) : 0;

            let rateStr;
            if (cycPerCellPerSec >= 1e6) rateStr = (cycPerCellPerSec / 1e6).toFixed(1) + 'M';
            else if (cycPerCellPerSec >= 1e3) rateStr = (cycPerCellPerSec / 1e3).toFixed(1) + 'K';
            else rateStr = cycPerCellPerSec.toFixed(0);

            statsEl.textContent =
                c.functional + '/' + c.total + ' alive' +
                '  var=' + c.loopVariants +
                '  ' + rateStr + ' cyc/cell/s';

            gridCtx.fillStyle = '#111';
            gridCtx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);

            for (let j = B - 1; j >= 0; j--) {
                for (let i = 0; i < B; i++) {
                    const sx = i * CHAR_W;
                    const sy = (B - 1 - j) * CHAR_H;
                    const ch = String.fromCharCode(c.cellChars[i * B + j]);
                    if (i === inspectI && j === inspectJ) {
                        gridCtx.fillStyle = '#066';
                        gridCtx.fillRect(sx, sy, CHAR_W, CHAR_H);
                        gridCtx.fillStyle = '#0ff';
                    } else if (i === inspectNI && j === inspectNJ) {
                        gridCtx.fillStyle = '#024';
                        gridCtx.fillRect(sx, sy, CHAR_W, CHAR_H);
                        gridCtx.fillStyle = '#08f';
                    } else {
                        gridCtx.fillStyle = '#0f0';
                    }
                    gridCtx.fillText(ch, sx, sy);
                }
            }
        }

        function drawCellView() {
            if (!sim || !sim.getCellView) return;

            function drawCell(ctx, view) {
                const img = ctx.createImageData(128, 64);
                const d = img.data;
                for (let row = 0; row < 32; row++) {
                    for (let col = 0; col < 32; col++) {
                        const byteIdx = row * 32 + col;
                        const val = view.data[byteIdx];
                        const wI = Math.pow(Math.min(1, view.writes[byteIdx]), 0.3);
                        const fI = Math.pow(Math.min(1, view.fetches[byteIdx]), 0.3);
                        const hasData = val > 0 ? 1 : 0;
                        for (let dy = 0; dy < 2; dy++) {
                            for (let dx = 0; dx < 4; dx++) {
                                const px = col * 4 + dx;
                                const py = row * 2 + dy;
                                const bit = (val >> (7 - (dy * 4 + dx))) & 1;
                                const br = bit ? 1.0 : 0.2;
                                const pi = (py * 128 + px) * 4;
                                d[pi]   = Math.min(255, Math.floor((wI * 255 + hasData * 15) * br));
                                d[pi+1] = Math.min(255, Math.floor((hasData * 40 + wI * 30 + fI * 30) * br));
                                d[pi+2] = Math.min(255, Math.floor((fI * 255 + hasData * 15) * br));
                                d[pi+3] = 255;
                            }
                        }
                    }
                }
                ctx.putImageData(img, 0, 0);
            }

            drawCell(ctx0, sim.getCellView(inspectI, inspectJ));
            drawCell(ctx1, sim.getCellView(inspectNI, inspectNJ));
        }

        gridCanvas.onclick = (e) => {
            const rect = gridCanvas.getBoundingClientRect();
            const scaleX = gridCanvas.width / rect.width;
            const scaleY = gridCanvas.height / rect.height;
            const px = (e.clientX - rect.left) * scaleX;
            const py = (e.clientY - rect.top) * scaleY;
            const col = Math.floor(px / CHAR_W);
            const row = sim.B - 1 - Math.floor(py / CHAR_H);
            if (col >= 0 && col < sim.B && row >= 0 && row < sim.B) {
                inspectI = col;
                inspectJ = row;
                inspectNI = (col + 1) % sim.B;
                inspectNJ = row;
                cellInfoEl.textContent = '(' + inspectI + ',' + inspectJ + ') + (' + inspectNI + ',' + inspectNJ + ')';
                drawCellView();
                drawGrid();
            }
        };

        async function tryGPU() {
            if (!navigator.gpu) return null;
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) return null;
                const { BareSim } = await import('./bare-sim.js');
                const s = await BareSim.create(32);
                return s;
            } catch (e) {
                print('GPU failed: ' + e.message);
                return null;
            }
        }

        async function useCPU() {
            const { BareSimCPU } = await import('./bare-sim-cpu.js');
            return BareSimCPU.create(32);
        }

        async function main() {
            logEl.textContent = '';
            print('Detecting GPU...');

            sim = await tryGPU();
            if (sim) {
                gpuMode = true;
                modeEl.textContent = '[GPU] WebGPU compute shader';
            } else {
                sim = await useCPU();
                gpuMode = false;
                modeEl.textContent = '[CPU] JavaScript fallback';
            }

            sim.writeCell(0, 0, 0, [0xB5, 0x00, 0x9D, 0x00, 0x04, 0xE8, 0x90, 0xF8]);
            sim.writeCell(0, 0, 0xF9, [0x00, 0x00]);
            sim.writeCell(0, 0, 0xFF, [0xFF]);

            print(sim.B + 'x' + sim.B + ' board. Click grid to inspect.');
            initGridCanvas();
            t0 = performance.now();
            await drawGrid();
            drawCellView();
        }

        // Main loop: run N passes per frame, controlled by dropdown
        let passQueue = 0; // fractional accumulator for sub-1 rates

        async function loop() {
            if (!running) return;

            const passesPerFrame = parseFloat(document.getElementById('speed').value) || 1;
            passQueue += passesPerFrame;
            const n = Math.floor(passQueue);
            passQueue -= n;

            for (let i = 0; i < n; i++) {
                await sim.runPass();
                await sim.runPass();
            }

            await drawGrid();
            drawCellView();

            if (running) requestAnimationFrame(loop);
        }

        document.getElementById('toggle').onclick = () => {
            running = !running;
            document.getElementById('toggle').textContent = running ? 'Stop' : 'Start';
            if (running) {
                t0 = performance.now();
                sim.totalQuanta = 0;
                requestAnimationFrame(loop);
            }
        };

        main();
    </script>
</body>
</html>
