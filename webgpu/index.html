<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>6502life WebGPU Bare Sim</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        #log { white-space: pre; font-size: 12px; line-height: 1.3; max-height: 200px; overflow-y: auto; }
        #grid { font-size: 10px; line-height: 1.0; letter-spacing: 1px; margin: 10px 0; }
        #stats { font-size: 16px; margin: 10px 0; }
        button { font-family: monospace; font-size: 16px; padding: 8px 16px;
                 background: #030; color: #0f0; border: 1px solid #0f0; cursor: pointer;
                 margin-right: 8px; margin-bottom: 8px; }
        button:hover { background: #050; }
        .alive { color: #0f0; }
        .dead { color: #333; }
    </style>
</head>
<body>
    <h2>6502life Bare Sim</h2>
    <div id="stats"></div>
    <pre id="grid"></pre>
    <button id="run10">Run 10</button>
    <button id="run100">Run 100</button>
    <button id="run1k">Run 1000</button>
    <button id="auto">Auto</button>
    <pre id="log"></pre>
    <script type="module">
        import { BareSim } from './bare-sim.js';

        const logEl = document.getElementById('log');
        const gridEl = document.getElementById('grid');
        const statsEl = document.getElementById('stats');
        function print(msg) { logEl.textContent += msg + '\n'; }

        let sim = null;
        let t0 = 0;
        let autoRunning = false;

        async function drawGrid() {
            const c = await sim.census();
            const B = sim.B;
            const elapsed = (performance.now() - t0) / 1000;
            const qps = elapsed > 0 ? (sim.totalQuanta / elapsed) : 0;

            statsEl.textContent =
                'fn=' + c.functional + '/' + c.total +
                '  var=' + c.loopVariants +
                '  q=' + sim.totalQuanta +
                '  ' + qps.toFixed(0) + ' q/s';

            // Draw B x B grid: # for functional, . for dead
            let grid = '';
            for (let j = B - 1; j >= 0; j--) {
                for (let i = 0; i < B; i++) {
                    const ci = i * B + j;
                    const base = ci * sim.M;
                    // Check functional inline from census data
                    grid += c.cellMap[ci] ? '#' : '.';
                }
                grid += '\n';
            }
            gridEl.textContent = grid;
        }

        async function main() {
            logEl.textContent = '';

            if (!navigator.gpu) {
                print('WebGPU not available. Enable in Safari Feature Flags.');
                return;
            }

            print('Initializing...');
            try {
                sim = await BareSim.create(16);
            } catch (e) {
                print('ERROR: ' + e.message);
                return;
            }

            // Plant BCC replicator
            sim.writeCell(0, 0, 0, [0xB5, 0x00, 0x9D, 0x00, 0x04, 0xE8, 0x90, 0xF8]);
            sim.writeCell(0, 0, 0xF9, [0x00, 0x00]);
            sim.writeCell(0, 0, 0xFF, [0xFF]);

            print('Board: ' + sim.B + 'x' + sim.B);
            t0 = performance.now();
            await drawGrid();
        }

        async function runRounds(n) {
            const rt0 = performance.now();
            for (let i = 0; i < n; i++) {
                await sim.runPass();
                await sim.runPass();
            }
            await drawGrid();
            const dt = (performance.now() - rt0) / 1000;
            print(n + 'r ' + sim.totalQuanta + 'q ' + dt.toFixed(2) + 's');
        }

        async function autoRun() {
            autoRunning = !autoRunning;
            document.getElementById('auto').textContent = autoRunning ? 'Stop' : 'Auto';
            while (autoRunning) {
                await runRounds(50);
                await new Promise(r => setTimeout(r, 10)); // yield to UI
            }
        }

        document.getElementById('run10').onclick = () => runRounds(10);
        document.getElementById('run100').onclick = () => runRounds(100);
        document.getElementById('run1k').onclick = () => runRounds(1000);
        document.getElementById('auto').onclick = autoRun;

        main();
    </script>
</body>
</html>
