<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>6502life Bare Sim</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
        #log { white-space: pre; font-size: 11px; line-height: 1.2; max-height: 150px; overflow-y: auto; }
        #grid { font-size: 10px; line-height: 1.0; letter-spacing: 2px; margin: 8px 0; }
        #stats { font-size: 14px; margin: 8px 0; }
        #mode { font-size: 12px; color: #0a0; margin-bottom: 8px; }
        button { font-family: monospace; font-size: 14px; padding: 6px 12px;
                 background: #030; color: #0f0; border: 1px solid #0f0; cursor: pointer;
                 margin-right: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <h3>6502life Bare Sim</h3>
    <div id="mode"></div>
    <div id="stats"></div>
    <pre id="grid"></pre>
    <div>
        <button id="run10">10</button>
        <button id="run100">100</button>
        <button id="run1k">1000</button>
        <button id="auto">Auto</button>
    </div>
    <canvas id="cellview" width="260" height="68" style="border:1px solid #030; image-rendering:pixelated; width:520px; height:136px;"></canvas>
    <div id="cellinfo" style="font-size:11px; color:#080;"></div>
    <pre id="log"></pre>
    <script type="module">
        const logEl = document.getElementById('log');
        const gridEl = document.getElementById('grid');
        const statsEl = document.getElementById('stats');
        const modeEl = document.getElementById('mode');
        function print(msg) { logEl.textContent += msg + '\n'; }

        let sim = null;
        let t0 = 0;
        let autoRunning = false;
        let gpuMode = false;

        async function drawGrid() {
            const c = await sim.census();
            const B = sim.B;
            const elapsed = (performance.now() - t0) / 1000;
            const qps = elapsed > 0 ? (sim.totalQuanta / elapsed) : 0;

            statsEl.textContent =
                c.functional + '/' + c.total + ' alive' +
                '  var=' + c.loopVariants +
                '  ' + sim.totalQuanta + 'q' +
                '  ' + qps.toFixed(0) + 'q/s';

            // Build grid: each char is a clickable span with data attributes
            let grid = '';
            for (let j = B - 1; j >= 0; j--) {
                for (let i = 0; i < B; i++) {
                    const ch = String.fromCharCode(c.cellChars[i * B + j]);
                    const escaped = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch;
                    let color = '#0f0';
                    if (i === inspectI && j === inspectJ) color = '#0ff';
                    else if (i === inspectNI && j === inspectNJ) color = '#06a';
                    grid += '<span data-i="' + i + '" data-j="' + j + '" style="color:' + color + '">' + escaped + '</span>';
                }
                grid += '\n';
            }
            gridEl.innerHTML = grid;
        }

        async function tryGPU() {
            if (!navigator.gpu) return null;
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) return null;
                const { BareSim } = await import('./bare-sim.js');
                const s = await BareSim.create(32);
                return s;
            } catch (e) {
                print('GPU failed: ' + e.message);
                return null;
            }
        }

        async function useCPU() {
            const { BareSimCPU } = await import('./bare-sim-cpu.js');
            return BareSimCPU.create(32);
        }

        async function main() {
            logEl.textContent = '';
            print('Detecting GPU...');

            sim = await tryGPU();
            if (sim) {
                gpuMode = true;
                modeEl.textContent = '[GPU] WebGPU compute shader';
                print('GPU OK');
            } else {
                sim = await useCPU();
                gpuMode = false;
                modeEl.textContent = '[CPU] JavaScript fallback';
                print('Using CPU fallback');
            }

            // Plant BCC replicator
            sim.writeCell(0, 0, 0, [0xB5, 0x00, 0x9D, 0x00, 0x04, 0xE8, 0x90, 0xF8]);
            sim.writeCell(0, 0, 0xF9, [0x00, 0x00]);
            sim.writeCell(0, 0, 0xFF, [0xFF]);

            print(sim.B + 'x' + sim.B + ' board');
            t0 = performance.now();
            await drawGrid();
            print('Ready.');
        }

        async function runRounds(n) {
            const rt0 = performance.now();
            for (let i = 0; i < n; i++) {
                await sim.runPass();
                await sim.runPass();
            }
            await drawGrid();
            drawCellView();
            const dt = (performance.now() - rt0) / 1000;
            print(n + 'r ' + dt.toFixed(2) + 's');
        }

        async function autoRun() {
            autoRunning = !autoRunning;
            document.getElementById('auto').textContent = autoRunning ? 'Stop' : 'Auto';
            let frames = 0;
            while (autoRunning) {
                const n = gpuMode ? 50 : 5;
                for (let i = 0; i < n; i++) {
                    await sim.runPass();
                    await sim.runPass();
                }
                frames++;
                drawCellView();
                // Redraw grid every 10 frames (~300ms) so chars update
                // but not every frame (to keep click targets stable most of the time)
                if (frames % 10 === 0) {
                    await drawGrid();
                }
                statsEl.textContent =
                    sim.totalQuanta + 'q  ' +
                    (sim.totalQuanta / ((performance.now() - t0) / 1000)).toFixed(0) + 'q/s';
                await new Promise(r => setTimeout(r, 30));
            }
            await drawGrid();
            drawCellView();
        }

        // Cell inspector: 4x2 pixels per byte, 32x32 bytes per cell, 2 cells
        let inspectI = 0, inspectJ = 0;
        let inspectNI = 1, inspectNJ = 0; // neighbor
        const cvs = document.getElementById('cellview');
        const ctx2d = cvs.getContext('2d');
        const cellInfoEl = document.getElementById('cellinfo');

        function drawCellView() {
            if (!sim || !sim.getCellView) return; // GPU mode has no getCellView
            const B = sim.B;
            // Inspected cell pair (cyan + dark blue on grid)
            const v0 = sim.getCellView(inspectI, inspectJ);
            const v1 = sim.getCellView(inspectNI, inspectNJ);

            const img = ctx2d.createImageData(260, 68);
            const d = img.data;

            function drawCell(view, xOff, yOff) {
                for (let row = 0; row < 32; row++) {
                    for (let col = 0; col < 32; col++) {
                        const byteIdx = row * 32 + col;
                        const val = view.data[byteIdx];
                        // Absolute glow: clamp at 1.0, gamma 0.3 for punch
                        const wI = Math.pow(Math.min(1, view.writes[byteIdx]), 0.3);
                        const fI = Math.pow(Math.min(1, view.fetches[byteIdx]), 0.3);
                        // Base green from byte content
                        const hasData = val > 0 ? 1 : 0;
                        // Draw 4x2 block
                        for (let dy = 0; dy < 2; dy++) {
                            for (let dx = 0; dx < 4; dx++) {
                                const px = xOff + col * 4 + dx;
                                const py = yOff + row * 2 + dy;
                                const bit = (val >> (7 - (dy * 4 + dx))) & 1;
                                const br = bit ? 1.0 : 0.2;
                                const pi = (py * 260 + px) * 4;
                                d[pi]   = Math.min(255, Math.floor((wI * 255 + hasData * 15) * br));
                                d[pi+1] = Math.min(255, Math.floor((hasData * 40 + wI * 30 + fI * 30) * br));
                                d[pi+2] = Math.min(255, Math.floor((fI * 255 + hasData * 15) * br));
                                d[pi+3] = 255;
                            }
                        }
                    }
                }
            }

            drawCell(v0, 0, 2);
            drawCell(v1, 132, 2);

            // Label
            ctx2d.putImageData(img, 0, 0);
        }

        // Click on grid: read data-i, data-j from the clicked span
        gridEl.onclick = (e) => {
            const span = e.target.closest('span[data-i]');
            if (!span) return;
            const col = parseInt(span.dataset.i);
            const row = parseInt(span.dataset.j);
            if (col >= 0 && col < sim.B && row >= 0 && row < sim.B) {
                inspectI = col;
                inspectJ = row;
                inspectNI = (col + 1) % sim.B;
                inspectNJ = row;
                cellInfoEl.textContent = '(' + inspectI + ',' + inspectJ + ') + (' + inspectNI + ',' + inspectNJ + ')';
                drawCellView();
                drawGrid();
            }
        };

        document.getElementById('run10').onclick = () => runRounds(10).then(drawCellView);
        document.getElementById('run100').onclick = () => runRounds(100).then(drawCellView);
        document.getElementById('run1k').onclick = () => runRounds(1000).then(drawCellView);
        document.getElementById('auto').onclick = autoRun;

        main();
    </script>
</body>
</html>
