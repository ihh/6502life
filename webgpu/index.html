<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>6502life Bare Sim</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
        #log { white-space: pre; font-size: 11px; line-height: 1.2; max-height: 150px; overflow-y: auto; }
        #grid { font-size: 10px; line-height: 1.0; letter-spacing: 2px; margin: 8px 0; }
        #stats { font-size: 14px; margin: 8px 0; }
        #mode { font-size: 12px; color: #0a0; margin-bottom: 8px; }
        button { font-family: monospace; font-size: 14px; padding: 6px 12px;
                 background: #030; color: #0f0; border: 1px solid #0f0; cursor: pointer;
                 margin-right: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <h3>6502life Bare Sim</h3>
    <div id="mode"></div>
    <div id="stats"></div>
    <pre id="grid"></pre>
    <div>
        <button id="run10">10</button>
        <button id="run100">100</button>
        <button id="run1k">1000</button>
        <button id="auto">Auto</button>
        <button id="slow">Slow</button>
        <label style="font-size:12px; margin-left:12px;"><input type="checkbox" id="lockview" checked> Lock view</label>
    </div>
    <canvas id="cellview" width="260" height="68" style="border:1px solid #030; image-rendering:pixelated; width:520px; height:136px;"></canvas>
    <div id="cellinfo" style="font-size:11px; color:#080;"></div>
    <pre id="log"></pre>
    <script type="module">
        const logEl = document.getElementById('log');
        const gridEl = document.getElementById('grid');
        const statsEl = document.getElementById('stats');
        const modeEl = document.getElementById('mode');
        function print(msg) { logEl.textContent += msg + '\n'; }

        let sim = null;
        let t0 = 0;
        let autoRunning = false;
        let gpuMode = false;

        async function drawGrid() {
            const c = await sim.census();
            const B = sim.B;
            const elapsed = (performance.now() - t0) / 1000;
            const qps = elapsed > 0 ? (sim.totalQuanta / elapsed) : 0;

            statsEl.textContent =
                c.functional + '/' + c.total + ' alive' +
                '  var=' + c.loopVariants +
                '  ' + sim.totalQuanta + 'q' +
                '  ' + qps.toFixed(0) + 'q/s';

            // Hash non-volatile parts of each cell (skip $F0-$FF registers, $100-$1FF stack)
            // Use pages 0 ($00-$EF), 2 ($200-$2FF), 3 ($300-$3FF)
            let grid = '';
            for (let j = B - 1; j >= 0; j--) {
                for (let i = 0; i < B; i++) {
                    const ch = c.cellChars[i * B + j];
                    grid += String.fromCharCode(ch);
                }
                grid += '\n';
            }
            gridEl.textContent = grid;
        }

        async function tryGPU() {
            if (!navigator.gpu) return null;
            try {
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) return null;
                const { BareSim } = await import('./bare-sim.js');
                const s = await BareSim.create(32);
                return s;
            } catch (e) {
                print('GPU failed: ' + e.message);
                return null;
            }
        }

        async function useCPU() {
            const { BareSimCPU } = await import('./bare-sim-cpu.js');
            return BareSimCPU.create(32);
        }

        async function main() {
            logEl.textContent = '';
            print('Detecting GPU...');

            sim = await tryGPU();
            if (sim) {
                gpuMode = true;
                modeEl.textContent = '[GPU] WebGPU compute shader';
                print('GPU OK');
            } else {
                sim = await useCPU();
                gpuMode = false;
                modeEl.textContent = '[CPU] JavaScript fallback';
                print('Using CPU fallback');
            }

            // Plant BCC replicator
            sim.writeCell(0, 0, 0, [0xB5, 0x00, 0x9D, 0x00, 0x04, 0xE8, 0x90, 0xF8]);
            sim.writeCell(0, 0, 0xF9, [0x00, 0x00]);
            sim.writeCell(0, 0, 0xFF, [0xFF]);

            print(sim.B + 'x' + sim.B + ' board');
            t0 = performance.now();
            await drawGrid();
            print('Ready.');
        }

        async function runRounds(n) {
            const rt0 = performance.now();
            for (let i = 0; i < n; i++) {
                await sim.runPass();
                await sim.runPass();
            }
            await drawGrid();
            drawCellView();
            const dt = (performance.now() - rt0) / 1000;
            print(n + 'r ' + dt.toFixed(2) + 's');
        }

        async function autoRun() {
            autoRunning = !autoRunning;
            document.getElementById('auto').textContent = autoRunning ? 'Stop' : 'Auto';
            while (autoRunning) {
                await runRounds(gpuMode ? 50 : 5);
                await new Promise(r => setTimeout(r, 10));
            }
        }

        // Cell inspector: 4x2 pixels per byte, 32x32 bytes per cell, 2 cells
        let inspectI = 0, inspectJ = 0;
        const cvs = document.getElementById('cellview');
        const ctx2d = cvs.getContext('2d');
        const cellInfoEl = document.getElementById('cellinfo');

        function drawCellView() {
            if (!sim || !sim.getCellView) return; // GPU mode has no getCellView
            const B = sim.B;
            // Active cell and its right neighbor (wrapping)
            const v0 = sim.getCellView(inspectI, inspectJ);
            const v1 = sim.getCellView((inspectI + 1) % B, inspectJ);

            const img = ctx2d.createImageData(260, 68);
            const d = img.data;

            function drawCell(view, xOff, yOff) {
                const maxW = 1, maxF = 1;
                // Find max for normalization
                let mw = 0.01, mf = 0.01;
                for (let k = 0; k < 1024; k++) {
                    if (view.writes[k] > mw) mw = view.writes[k];
                    if (view.fetches[k] > mf) mf = view.fetches[k];
                }
                for (let row = 0; row < 32; row++) {
                    for (let col = 0; col < 32; col++) {
                        const byteIdx = row * 32 + col;
                        const val = view.data[byteIdx];
                        const wIntensity = Math.min(1, view.writes[byteIdx] / mw);
                        const fIntensity = Math.min(1, view.fetches[byteIdx] / mf);
                        // Green: constant base + byte value
                        const g = 30 + (val > 0 ? 40 : 0);
                        // Red: write recency
                        const r = Math.floor(wIntensity * 220);
                        // Blue: fetch recency
                        const b = Math.floor(fIntensity * 220);
                        // Draw 4x2 block
                        for (let dy = 0; dy < 2; dy++) {
                            for (let dx = 0; dx < 4; dx++) {
                                const px = xOff + col * 4 + dx;
                                const py = yOff + row * 2 + dy;
                                const bit = (val >> (7 - (dy * 4 + dx))) & 1;
                                const brightness = bit ? 1.0 : 0.25;
                                const pi = (py * 260 + px) * 4;
                                d[pi] = Math.min(255, r * brightness + g * 0.2);
                                d[pi+1] = Math.min(255, g * brightness);
                                d[pi+2] = Math.min(255, b * brightness + 10);
                                d[pi+3] = 255;
                            }
                        }
                    }
                }
            }

            drawCell(v0, 0, 2);
            drawCell(v1, 132, 2);

            // Label
            ctx2d.putImageData(img, 0, 0);
        }

        // Click on grid to select cell
        gridEl.onclick = (e) => {
            const rect = gridEl.getBoundingClientRect();
            const charW = gridEl.offsetWidth / sim.B;
            const charH = gridEl.offsetHeight / (sim.B + 1);
            const col = Math.floor((e.clientX - rect.left) / charW);
            const row = sim.B - 1 - Math.floor((e.clientY - rect.top) / charH);
            if (col >= 0 && col < sim.B && row >= 0 && row < sim.B) {
                inspectI = col;
                inspectJ = row;
                cellInfoEl.textContent = 'Inspecting (' + inspectI + ',' + inspectJ + ')';
                drawCellView();
            }
        };

        let slowRunning = false;

        async function slowRun() {
            slowRunning = !slowRunning;
            document.getElementById('slow').textContent = slowRunning ? 'Stop Slow' : 'Slow';
            if (!sim.initSlowMode) { print('Slow mode: CPU only'); slowRunning = false; return; }
            if (!sim.writeGlow) sim.initSlowMode();

            while (slowRunning) {
                const result = sim.slowStep(50); // ~50 cycles per frame
                const locked = document.getElementById('lockview').checked;
                if (!locked && result.cell) {
                    inspectI = result.cell.ci;
                    inspectJ = result.cell.cj;
                    cellInfoEl.textContent = '(' + inspectI + ',' + inspectJ + ') -> (' +
                        result.cell.ni + ',' + result.cell.nj + ')';
                }
                drawCellView();
                if (result.done) {
                    await drawGrid(); // update ASCII grid when quantum finishes
                }
                await new Promise(r => setTimeout(r, 20)); // ~50fps
            }
        }

        document.getElementById('run10').onclick = () => runRounds(10).then(drawCellView);
        document.getElementById('run100').onclick = () => runRounds(100).then(drawCellView);
        document.getElementById('run1k').onclick = () => runRounds(1000).then(drawCellView);
        document.getElementById('auto').onclick = autoRun;
        document.getElementById('slow').onclick = slowRun;

        main();
    </script>
</body>
</html>
