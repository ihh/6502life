<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>6502life Bare Sim</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
        #log { white-space: pre; font-size: 11px; line-height: 1.2; max-height: 60px; overflow-y: auto; }
        #grid { cursor: crosshair; }
        #stats { font-size: 14px; margin: 8px 0; }
        #mode { font-size: 12px; color: #0a0; margin-bottom: 8px; }
        #cellinfo { font-size: 11px; color: #080; margin: 4px 0; }
        #disasm { font-size: 10px; line-height: 1.3; color: #0a0; white-space: pre; margin: 0; }
        .dasm-cur { color: #fff; background: #030; }
        button, select { font-family: monospace; font-size: 14px; padding: 6px 12px;
                 background: #030; color: #0f0; border: 1px solid #0f0; cursor: pointer;
                 margin-right: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <h3>6502life Bare Sim</h3>
    <div id="mode"></div>
    <div id="stats"></div>
    <div style="display:flex; gap:12px; align-items:flex-start; margin:8px 0;">
        <canvas id="grid"></canvas>
        <div id="inspector" style="width:256px;">
            <canvas id="cv0" width="128" height="64" style="border:1px solid #006; image-rendering:pixelated; width:256px; height:128px; display:block;"></canvas>
            <canvas id="cv1" width="128" height="64" style="border:1px solid #600; image-rendering:pixelated; width:256px; height:128px; display:block; margin-top:4px;"></canvas>
            <div id="cellinfo"></div>
            <pre id="disasm"></pre>
        </div>
    </div>
    <div>
        <button id="toggle">Start</button>
        <select id="speed">
            <option value="0.05">crawl</option>
            <option value="0.1">very slow</option>
            <option value="0.25">slow</option>
            <option value="1" selected>normal</option>
            <option value="5">fast</option>
            <option value="25">very fast</option>
            <option value="100">max</option>
        </select>
        <select id="nbrdir">
            <option value="e" selected>nbr: E</option>
            <option value="w">nbr: W</option>
            <option value="n">nbr: N</option>
            <option value="s">nbr: S</option>
        </select>
    </div>
    <pre id="log"></pre>
    <script type="module">
        import { disassemble } from './disasm.js';

        const $ = id => document.getElementById(id);
        const logEl=$('log'), gridCanvas=$('grid'), statsEl=$('stats');
        const modeEl=$('mode'), cellInfoEl=$('cellinfo'), dasmEl=$('disasm');
        const gridCtx = gridCanvas.getContext('2d');
        const ctx0 = $('cv0').getContext('2d'), ctx1 = $('cv1').getContext('2d');
        function print(msg) { logEl.textContent += msg + '\n'; }

        let running=false, gpuMode=false, gpuSim=null, worker=null;
        const B=32, MEAN_CYC=4096, CHAR_W=8, CHAR_H=12;
        let inspectI=0, inspectJ=0, inspectNI=1, inspectNJ=0;
        let lastCensus=null, lastCellView0=null, lastCellView1=null;
        let totalQuanta=0, rateEMA=0, lastQuanta=0, lastRateTime=0;
        let fpsFrames=0, fpsT0=0, fpsVal=0;
        let currentTrace=null, traceIdx=0;
        let glowWrite=new Float32Array(2048), glowFetch=new Float32Array(2048);
        const GLOW_DECAY=0.93;

        function updateNeighbor() {
            const d=$('nbrdir').value;
            inspectNI=(inspectI+(d==='e'?1:d==='w'?-1:0)+B)%B;
            inspectNJ=(inspectJ+(d==='n'?1:d==='s'?-1:0)+B)%B;
            cellInfoEl.textContent='('+inspectI+','+inspectJ+') + ('+inspectNI+','+inspectNJ+')';
            if(worker) worker.postMessage({type:'traceCell',i:inspectI,j:inspectJ});
        }

        function initGridCanvas() {
            gridCanvas.width=B*CHAR_W; gridCanvas.height=B*CHAR_H;
            gridCanvas.style.width=(B*CHAR_W)+'px'; gridCanvas.style.height=(B*CHAR_H)+'px';
            gridCtx.font='10px monospace'; gridCtx.textBaseline='top';
        }

        function renderGrid() {
            if(!lastCensus) return;
            const c=lastCensus, now=performance.now();
            if(running && now-lastRateTime>300) {
                const dq=totalQuanta-lastQuanta, dt=(now-lastRateTime)/1000;
                rateEMA=rateEMA*0.7+(dt>0?dq*MEAN_CYC/(B*B)/dt:0)*0.3;
                lastQuanta=totalQuanta; lastRateTime=now;
            }
            const cps=running?rateEMA:0;
            let r; if(cps>=1e6)r=(cps/1e6).toFixed(1)+'M'; else if(cps>=1e3)r=(cps/1e3).toFixed(1)+'K'; else r=cps.toFixed(0);
            fpsFrames++;
            if(now-fpsT0>1000){fpsVal=Math.round(fpsFrames*1000/(now-fpsT0));fpsFrames=0;fpsT0=now;}
            statsEl.textContent=c.functional+'/'+c.total+' alive  var='+c.loopVariants+'  '+r+' cyc/cell/s  '+fpsVal+' fps';

            gridCtx.fillStyle='#111'; gridCtx.fillRect(0,0,gridCanvas.width,gridCanvas.height);
            gridCtx.font='10px monospace'; gridCtx.textBaseline='top';
            for(let j=B-1;j>=0;j--) for(let i=0;i<B;i++) {
                const sx=i*CHAR_W, sy=(B-1-j)*CHAR_H;
                const ch=String.fromCharCode(c.cellChars[i*B+j]);
                if(i===inspectI&&j===inspectJ) {
                    gridCtx.fillStyle='#006'; gridCtx.fillRect(sx,sy,CHAR_W,CHAR_H); gridCtx.fillStyle='#4af';
                } else if(i===inspectNI&&j===inspectNJ) {
                    gridCtx.fillStyle='#400'; gridCtx.fillRect(sx,sy,CHAR_W,CHAR_H); gridCtx.fillStyle='#f88';
                } else { gridCtx.fillStyle='#0f0'; }
                gridCtx.fillText(ch,sx,sy);
            }
        }

        function renderCellView(ctx, cellData, glowOff) {
            if(!cellData) return;
            const img=ctx.createImageData(128,64); const d=img.data;
            for(let row=0;row<32;row++) for(let col=0;col<32;col++) {
                const byteIdx=row*32+col, val=cellData[byteIdx];
                const wI=Math.pow(Math.min(1,glowWrite[glowOff+byteIdx]),0.3);
                const fI=Math.pow(Math.min(1,glowFetch[glowOff+byteIdx]),0.3);
                for(let dy=0;dy<2;dy++) for(let dx=0;dx<4;dx++) {
                    const bit=(val>>(7-(dy*4+dx)))&1;
                    const pi=((row*2+dy)*128+col*4+dx)*4;
                    if(bit) {
                        // '1' pixel: green=max, plus red/blue glow
                        d[pi]  =Math.min(255,Math.floor(wI*255+20));
                        d[pi+1]=255; // green always max for '1' bits
                        d[pi+2]=Math.min(255,Math.floor(fI*255+20));
                    } else {
                        // '0' pixel: dim, glow only
                        d[pi]  =Math.min(255,Math.floor(wI*40));
                        d[pi+1]=Math.floor(15);
                        d[pi+2]=Math.min(255,Math.floor(fI*40));
                    }
                    d[pi+3]=255;
                }
            }
            ctx.putImageData(img,0,0);
        }

        function renderDisasm() {
            if(!lastCellView0) { dasmEl.textContent=''; return; }
            const mem=lastCellView0.data;
            const pc=(mem[0xF9]<<8)|mem[0xFA];
            const lines=disassemble(mem,pc,8,0x3FF); // 1K cell mask
            let html='';
            for(let i=0;i<lines.length;i++) {
                if(i===0) html+='<span class="dasm-cur">'+escHtml(lines[i].text)+'</span>\n';
                else html+=escHtml(lines[i].text)+'\n';
            }
            dasmEl.innerHTML=html;
        }
        function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

        function animateTrace() {
            if(!currentTrace||traceIdx>=currentTrace.length) return;
            const speed=parseFloat($('speed').value)||1;
            const cycPerFrame=speed<1?4:speed<5?20:99999;
            let cyc=0;
            while(traceIdx<currentTrace.length&&cyc<cycPerFrame) {
                const insn=currentTrace[traceIdx];
                glowFetch[insn.fetch]=1.0;
                for(const wa of insn.writes) glowWrite[wa]=1.0;
                cyc+=insn.cycles; traceIdx++;
            }
        }

        function renderLoop() {
            for(let i=0;i<2048;i++){glowWrite[i]*=GLOW_DECAY;glowFetch[i]*=GLOW_DECAY;}
            animateTrace();
            renderGrid();
            if(lastCellView0) renderCellView(ctx0,lastCellView0.data,0);
            if(lastCellView1) renderCellView(ctx1,lastCellView1.data,1024);
            renderDisasm();
            if(running) requestCellViews();
            requestAnimationFrame(renderLoop);
        }

        // === GPU ===
        let gpuPassQueue=0;
        async function gpuLoop() {
            if(!running||!gpuMode) return;
            const speed=parseFloat($('speed').value)||1;
            gpuPassQueue+=speed; const n=Math.floor(gpuPassQueue); gpuPassQueue-=n;
            for(let i=0;i<n;i++){await gpuSim.runPass();await gpuSim.runPass();}
            lastCensus=await gpuSim.census(); totalQuanta=gpuSim.totalQuanta;
            if(gpuSim.getCellView) {
                lastCellView0=gpuSim.getCellView(inspectI,inspectJ);
                lastCellView1=gpuSim.getCellView(inspectNI,inspectNJ);
            }
            if(running) requestAnimationFrame(gpuLoop);
        }

        // === Worker ===
        function workerSend(msg){worker.postMessage(msg);}
        function requestCellViews() {
            if(gpuMode&&gpuSim&&gpuSim.getCellView) {
                lastCellView0=gpuSim.getCellView(inspectI,inspectJ);
                lastCellView1=gpuSim.getCellView(inspectNI,inspectNJ);
            } else if(worker) {
                workerSend({type:'getCellView',i:inspectI,j:inspectJ});
                workerSend({type:'getCellView',i:inspectNI,j:inspectNJ});
            }
        }
        function setupWorker() {
            worker=new Worker('./sim-worker.js',{type:'module'});
            worker.onmessage=(e)=>{
                const msg=e.data;
                if(msg.type==='ready'){
                    workerSend({type:'writeCell',i:0,j:0,offset:0,data:[0xB5,0x00,0x9D,0x00,0x04,0xE8,0x90,0xF8]});
                    workerSend({type:'writeCell',i:0,j:0,offset:0xF9,data:[0x00,0x00]});
                    workerSend({type:'writeCell',i:0,j:0,offset:0xFF,data:[0xFF]});
                    workerSend({type:'traceCell',i:inspectI,j:inspectJ});
                    workerSend({type:'census'});
                } else if(msg.type==='census'){
                    lastCensus=msg.data; totalQuanta=msg.totalQuanta;
                } else if(msg.type==='cellView'){
                    if(msg.i===inspectI&&msg.j===inspectJ) lastCellView0=msg;
                    else if(msg.i===inspectNI&&msg.j===inspectNJ) lastCellView1=msg;
                } else if(msg.type==='trace'){
                    currentTrace=msg.data.trace; traceIdx=0;
                }
            };
        }

        gridCanvas.onclick=(e)=>{
            const rect=gridCanvas.getBoundingClientRect();
            const col=Math.floor((e.clientX-rect.left)*gridCanvas.width/rect.width/CHAR_W);
            const row=B-1-Math.floor((e.clientY-rect.top)*gridCanvas.height/rect.height/CHAR_H);
            if(col>=0&&col<B&&row>=0&&row<B){
                inspectI=col;inspectJ=row;
                updateNeighbor(); glowWrite.fill(0);glowFetch.fill(0); requestCellViews();
            }
        };
        $('nbrdir').onchange=()=>{updateNeighbor();requestCellViews();};
        $('speed').onchange=()=>{if(!gpuMode&&running)workerSend({type:'speed',speed:parseFloat($('speed').value)||1});};

        async function main() {
            logEl.textContent='';
            if(navigator.gpu){try{
                const adapter=await navigator.gpu.requestAdapter();
                if(adapter){const{BareSim}=await import('./bare-sim.js');gpuSim=await BareSim.create(B);gpuMode=true;}
            }catch(e){print('GPU: '+e.message);}}
            if(gpuMode){
                modeEl.textContent='[GPU] WebGPU compute shader';
                gpuSim.writeCell(0,0,0,[0xB5,0x00,0x9D,0x00,0x04,0xE8,0x90,0xF8]);
                gpuSim.writeCell(0,0,0xF9,[0x00,0x00]);gpuSim.writeCell(0,0,0xFF,[0xFF]);
                lastCensus=await gpuSim.census();totalQuanta=gpuSim.totalQuanta;
                if(gpuSim.getCellView){lastCellView0=gpuSim.getCellView(0,0);lastCellView1=gpuSim.getCellView(1,0);}
            } else {
                modeEl.textContent='[CPU] Web Worker';
                setupWorker();workerSend({type:'init',B});
            }
            print(B+'x'+B+' board. Click grid to inspect.');
            initGridCanvas(); fpsT0=lastRateTime=performance.now();
            requestAnimationFrame(renderLoop);
        }

        $('toggle').onclick=()=>{
            running=!running;
            $('toggle').textContent=running?'Stop':'Start';
            if(running){
                lastRateTime=performance.now();lastQuanta=totalQuanta;rateEMA=0;
                fpsT0=performance.now();fpsFrames=0;
                const speed=parseFloat($('speed').value)||1;
                if(gpuMode){gpuSim.totalQuanta=0;totalQuanta=0;gpuPassQueue=0;requestAnimationFrame(gpuLoop);}
                else workerSend({type:'start',speed});
            } else {
                if(!gpuMode){workerSend({type:'stop'});workerSend({type:'census'});}
                requestCellViews();
            }
        };

        main();
    </script>
</body>
</html>
