<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>6502life Bare Sim</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 12px; }
        #log { white-space: pre; font-size: 11px; line-height: 1.2; max-height: 100px; overflow-y: auto; }
        #grid { cursor: crosshair; }
        #stats { font-size: 14px; margin: 8px 0; }
        #mode { font-size: 12px; color: #0a0; margin-bottom: 8px; }
        #cellinfo { font-size: 11px; color: #080; }
        button, select { font-family: monospace; font-size: 14px; padding: 6px 12px;
                 background: #030; color: #0f0; border: 1px solid #0f0; cursor: pointer;
                 margin-right: 6px; margin-bottom: 6px; }
    </style>
</head>
<body>
    <h3>6502life Bare Sim</h3>
    <div id="mode"></div>
    <div id="stats"></div>
    <div style="display:flex; gap:12px; align-items:flex-start; margin:8px 0;">
        <canvas id="grid"></canvas>
        <div>
            <canvas id="cv0" width="128" height="64" style="border:1px solid #066; image-rendering:pixelated; width:256px; height:128px; display:block;"></canvas>
            <canvas id="cv1" width="128" height="64" style="border:1px solid #036; image-rendering:pixelated; width:256px; height:128px; display:block; margin-top:4px;"></canvas>
            <div id="cellinfo"></div>
        </div>
    </div>
    <div>
        <button id="toggle">Start</button>
        <select id="speed">
            <option value="0.05">crawl</option>
            <option value="0.1">very slow</option>
            <option value="0.25">slow</option>
            <option value="1" selected>normal</option>
            <option value="5">fast</option>
            <option value="25">very fast</option>
            <option value="100">max</option>
        </select>
        <select id="nbrdir">
            <option value="e" selected>nbr: E</option>
            <option value="w">nbr: W</option>
            <option value="n">nbr: N</option>
            <option value="s">nbr: S</option>
        </select>
    </div>
    <pre id="log"></pre>
    <script type="module">
        const logEl = document.getElementById('log');
        const gridCanvas = document.getElementById('grid');
        const gridCtx = gridCanvas.getContext('2d');
        const statsEl = document.getElementById('stats');
        const modeEl = document.getElementById('mode');
        const cellInfoEl = document.getElementById('cellinfo');
        const ctx0 = document.getElementById('cv0').getContext('2d');
        const ctx1 = document.getElementById('cv1').getContext('2d');

        function print(msg) { logEl.textContent += msg + '\n'; }

        let running = false;
        let gpuMode = false;
        let gpuSim = null;     // direct reference for GPU mode
        let worker = null;     // worker for CPU mode
        let B = 32;
        let inspectI = 0, inspectJ = 0, inspectNI = 1, inspectNJ = 0;

        function updateNeighbor() {
            const dir = document.getElementById('nbrdir').value;
            const di = dir === 'e' ? 1 : dir === 'w' ? -1 : 0;
            const dj = dir === 'n' ? 1 : dir === 's' ? -1 : 0;
            inspectNI = (inspectI + di + B) % B;
            inspectNJ = (inspectJ + dj + B) % B;
            cellInfoEl.textContent = '('+inspectI+','+inspectJ+') + ('+inspectNI+','+inspectNJ+')';
        }
        let t0 = 0;
        let lastCensus = null;
        let lastCellView0 = null, lastCellView1 = null;
        let totalQuanta = 0;
        let framesSinceReset = 0;
        let fpsT0 = 0;
        const MEAN_CYC = 4096;
        const CHAR_W = 8, CHAR_H = 12;

        function initGridCanvas() {
            gridCanvas.width = B * CHAR_W;
            gridCanvas.height = B * CHAR_H;
            gridCanvas.style.width = (B * CHAR_W) + 'px';
            gridCanvas.style.height = (B * CHAR_H) + 'px';
            gridCtx.font = '10px monospace';
            gridCtx.textBaseline = 'top';
        }

        function renderGrid() {
            if (!lastCensus) return;
            const c = lastCensus;
            const now = performance.now();
            const elapsed = (now - t0) / 1000;
            const cps = elapsed > 0 ? (totalQuanta * MEAN_CYC / (B * B) / elapsed) : 0;
            let r;
            if (cps >= 1e6) r = (cps/1e6).toFixed(1)+'M';
            else if (cps >= 1e3) r = (cps/1e3).toFixed(1)+'K';
            else r = cps.toFixed(0);
            framesSinceReset++;
            const fpsElapsed = (now - fpsT0) / 1000;
            const fps = fpsElapsed > 0.5 ? (framesSinceReset / fpsElapsed).toFixed(0) : '--';
            if (fpsElapsed > 1) { framesSinceReset = 0; fpsT0 = now; }
            statsEl.textContent = c.functional+'/'+c.total+' alive  var='+c.loopVariants+'  '+r+' cyc/cell/s  '+fps+' fps';

            gridCtx.fillStyle = '#111';
            gridCtx.fillRect(0, 0, gridCanvas.width, gridCanvas.height);
            for (let j = B-1; j >= 0; j--) {
                for (let i = 0; i < B; i++) {
                    const sx = i*CHAR_W, sy = (B-1-j)*CHAR_H;
                    const ch = String.fromCharCode(c.cellChars[i*B+j]);
                    if (i===inspectI && j===inspectJ) {
                        gridCtx.fillStyle='#066'; gridCtx.fillRect(sx,sy,CHAR_W,CHAR_H); gridCtx.fillStyle='#0ff';
                    } else if (i===inspectNI && j===inspectNJ) {
                        gridCtx.fillStyle='#024'; gridCtx.fillRect(sx,sy,CHAR_W,CHAR_H); gridCtx.fillStyle='#08f';
                    } else { gridCtx.fillStyle='#0f0'; }
                    gridCtx.fillText(ch, sx, sy);
                }
            }
        }

        function renderCellView(ctx, view) {
            if (!view) return;
            const img = ctx.createImageData(128, 64);
            const d = img.data;
            for (let row = 0; row < 32; row++) {
                for (let col = 0; col < 32; col++) {
                    const byteIdx = row*32+col;
                    const val = view.data[byteIdx];
                    const wI = Math.pow(Math.min(1, view.writes[byteIdx]), 0.3);
                    const fI = Math.pow(Math.min(1, view.fetches[byteIdx]), 0.3);
                    const has = val > 0 ? 1 : 0;
                    for (let dy = 0; dy < 2; dy++) {
                        for (let dx = 0; dx < 4; dx++) {
                            const bit = (val >> (7-(dy*4+dx))) & 1;
                            const br = bit ? 1.0 : 0.2;
                            const pi = ((row*2+dy)*128 + col*4+dx)*4;
                            d[pi]   = Math.min(255, Math.floor((wI*255+has*15)*br));
                            d[pi+1] = Math.min(255, Math.floor((has*40+wI*30+fI*30)*br));
                            d[pi+2] = Math.min(255, Math.floor((fI*255+has*15)*br));
                            d[pi+3] = 255;
                        }
                    }
                }
            }
            ctx.putImageData(img, 0, 0);
        }

        gridCanvas.onclick = (e) => {
            const rect = gridCanvas.getBoundingClientRect();
            const sx = gridCanvas.width/rect.width, sy = gridCanvas.height/rect.height;
            const col = Math.floor((e.clientX-rect.left)*sx/CHAR_W);
            const row = B-1-Math.floor((e.clientY-rect.top)*sy/CHAR_H);
            if (col>=0 && col<B && row>=0 && row<B) {
                inspectI=col; inspectJ=row;
                updateNeighbor();
                requestCellViews();
                renderGrid();
            }
        };

        // === GPU mode: direct calls ===
        async function gpuCensus() {
            lastCensus = await gpuSim.census();
            totalQuanta = gpuSim.totalQuanta;
        }
        async function gpuCellViews() {
            if (gpuSim.getCellView) {
                lastCellView0 = gpuSim.getCellView(inspectI, inspectJ);
                lastCellView1 = gpuSim.getCellView(inspectNI, inspectNJ);
            }
        }

        // === CPU mode: worker messages ===
        function workerSend(msg) { worker.postMessage(msg); }

        function setupWorker() {
            worker = new Worker('./sim-worker.js', { type: 'module' });
            worker.onmessage = (e) => {
                const msg = e.data;
                if (msg.type === 'ready') {
                    print('Worker ready');
                    workerSend({ type: 'writeCell', i:0, j:0, offset:0, data:[0xB5,0x00,0x9D,0x00,0x04,0xE8,0x90,0xF8] });
                    workerSend({ type: 'writeCell', i:0, j:0, offset:0xF9, data:[0x00,0x00] });
                    workerSend({ type: 'writeCell', i:0, j:0, offset:0xFF, data:[0xFF] });
                    workerSend({ type: 'census' });
                } else if (msg.type === 'census') {
                    lastCensus = msg.data;
                    totalQuanta = msg.totalQuanta;
                } else if (msg.type === 'cellView') {
                    if (msg.i === inspectI && msg.j === inspectJ) {
                        lastCellView0 = msg;
                    } else if (msg.i === inspectNI && msg.j === inspectNJ) {
                        lastCellView1 = msg;
                    }
                }
            };
        }

        function requestCellViews() {
            if (gpuMode) {
                gpuCellViews();
            } else if (worker) {
                workerSend({ type: 'getCellView', i: inspectI, j: inspectJ });
                workerSend({ type: 'getCellView', i: inspectNI, j: inspectNJ });
            }
        }

        // === Render loop (always on main thread) ===
        function renderLoop() {
            renderGrid();
            renderCellView(ctx0, lastCellView0);
            renderCellView(ctx1, lastCellView1);
            requestAnimationFrame(renderLoop);
        }

        // === GPU run loop ===
        let gpuPassQueue = 0;
        async function gpuLoop() {
            if (!running || !gpuMode) return;
            const speed = parseFloat(document.getElementById('speed').value) || 1;
            gpuPassQueue += speed;
            const n = Math.floor(gpuPassQueue);
            gpuPassQueue -= n;
            for (let i = 0; i < n; i++) {
                await gpuSim.runPass();
                await gpuSim.runPass();
            }
            await gpuCensus();
            gpuCellViews();
            if (running) requestAnimationFrame(gpuLoop);
        }

        // === Init ===
        async function main() {
            logEl.textContent = '';
            print('Detecting GPU...');

            // Try GPU
            if (navigator.gpu) {
                try {
                    const adapter = await navigator.gpu.requestAdapter();
                    if (adapter) {
                        const { BareSim } = await import('./bare-sim.js');
                        gpuSim = await BareSim.create(B);
                        gpuMode = true;
                    }
                } catch(e) { print('GPU: ' + e.message); }
            }

            if (gpuMode) {
                modeEl.textContent = '[GPU] WebGPU compute shader';
                gpuSim.writeCell(0, 0, 0, [0xB5,0x00,0x9D,0x00,0x04,0xE8,0x90,0xF8]);
                gpuSim.writeCell(0, 0, 0xF9, [0x00,0x00]);
                gpuSim.writeCell(0, 0, 0xFF, [0xFF]);
                await gpuCensus();
                gpuCellViews();
            } else {
                modeEl.textContent = '[CPU] Web Worker';
                setupWorker();
                workerSend({ type: 'init', B });
            }

            print(B + 'x' + B + ' board. Click grid to inspect.');
            initGridCanvas();
            t0 = performance.now();

            // Start render loop (always running, just draws latest data)
            requestAnimationFrame(renderLoop);
        }

        document.getElementById('toggle').onclick = () => {
            running = !running;
            document.getElementById('toggle').textContent = running ? 'Stop' : 'Start';
            t0 = performance.now();
            totalQuanta = 0;
            if (gpuMode && gpuSim) gpuSim.totalQuanta = 0;

            if (running) {
                const speed = parseFloat(document.getElementById('speed').value) || 1;
                if (gpuMode) {
                    requestAnimationFrame(gpuLoop);
                } else {
                    workerSend({ type: 'start', speed });
                }
            } else {
                if (!gpuMode) {
                    workerSend({ type: 'stop' });
                    workerSend({ type: 'census' });
                    requestCellViews();
                }
            }
        };

        document.getElementById('nbrdir').onchange = () => {
            updateNeighbor();
            requestCellViews();
            renderGrid();
        };

        document.getElementById('speed').onchange = () => {
            const speed = parseFloat(document.getElementById('speed').value) || 1;
            if (!gpuMode && running) {
                workerSend({ type: 'speed', speed });
            }
        };

        main();
    </script>
</body>
</html>
