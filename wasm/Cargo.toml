[package]
name = "board6502-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM engine for 6502life — BoardMemory + 6502 CPU emulation"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
once_cell = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = 3
lto = true
